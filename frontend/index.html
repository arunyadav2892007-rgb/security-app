<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Meta Tags -->
    <title>ECCO Road Safety Training | Online MCQ Certification & Exam Portal</title>
    <meta name="description" content="Official ECCO Road Safety online certification test and defensive driving examination. Pass the MCQ test and receive your verified certificate for ₹100." />
    <meta name="theme-color" content="#1a6c7a" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS / Safari PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ECCO Safety" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Google Fonts Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Razorpay standard checkout script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✓ PWA Service Worker Registered! Scope:', reg.scope))
            .catch((err) => console.warn('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
